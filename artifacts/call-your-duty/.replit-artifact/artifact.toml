kind = "web"
previewPath = "/"
title = "Call Your Duty"
version = "1.0.0"
id = "artifacts/call-your-duty"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18201

[services.development]
run = "pnpm --filter @workspace/call-your-duty run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/call-your-duty", "run", "build" ]
publicDir = "artifacts/call-your-duty/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18201"
BASE_PATH = "/"
