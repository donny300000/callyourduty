openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User identity
  - name: groups
    description: Friend groups
  - name: logs
    description: Poop logs
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create an account and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Email already in use

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid email or password

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found

  /users/{userId}/summary:
    get:
      operationId: getUserSummary
      tags: [users]
      summary: Get a user's personal stats summary
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"

  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List groups the current user belongs to
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a new group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /groups/join:
    post:
      operationId: joinGroup
      tags: [groups]
      summary: Join a group via invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupJoinInput"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "404":
          description: Invalid invite code

  /groups/{groupId}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get group detail with members
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "404":
          description: Not found

  /groups/{groupId}/logs:
    get:
      operationId: listGroupLogs
      tags: [groups]
      summary: List all logs posted by group members
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PoopLog"

  /groups/{groupId}/leaderboard:
    get:
      operationId: getGroupLeaderboard
      tags: [groups]
      summary: Get aggregated per-member stats for a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /logs:
    get:
      operationId: listLogs
      tags: [logs]
      summary: List the current user's own poop logs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PoopLog"
    post:
      operationId: createLog
      tags: [logs]
      summary: Create a new poop log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoopLogInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoopLog"

  /logs/{logId}:
    get:
      operationId: getLog
      tags: [logs]
      summary: Get a single poop log
      parameters:
        - name: logId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoopLog"
        "404":
          description: Not found
    delete:
      operationId: deleteLog
      tags: [logs]
      summary: Delete a poop log
      parameters:
        - name: logId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, name, email, avatarColor, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        avatarColor: { type: string }
        createdAt: { type: string, format: date-time }

    SignupInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        email: { type: string, format: email }
        password: { type: string, minLength: 4 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 4 }

    UserSummary:
      type: object
      required: [totalLogs, averageOverall, longestStreakDays, favoriteSpot, groupCount]
      properties:
        totalLogs: { type: integer }
        averageOverall: { type: ["number", "null"] }
        longestStreakDays: { type: integer }
        favoriteSpot: { type: ["string", "null"] }
        groupCount: { type: integer }

    Group:
      type: object
      required: [id, name, inviteCode, memberCount, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        inviteCode: { type: string }
        memberCount: { type: integer }
        createdAt: { type: string, format: date-time }

    GroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }

    GroupJoinInput:
      type: object
      required: [inviteCode]
      properties:
        inviteCode: { type: string }

    GroupMember:
      type: object
      required: [id, name, avatarColor, joinedAt]
      properties:
        id: { type: string }
        name: { type: string }
        avatarColor: { type: string }
        joinedAt: { type: string, format: date-time }

    GroupDetail:
      type: object
      required: [id, name, inviteCode, createdAt, members]
      properties:
        id: { type: string }
        name: { type: string }
        inviteCode: { type: string }
        createdAt: { type: string, format: date-time }
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMember"

    LeaderboardEntry:
      type: object
      required: [userId, name, avatarColor, totalLogs, averageOverall]
      properties:
        userId: { type: string }
        name: { type: string }
        avatarColor: { type: string }
        totalLogs: { type: integer }
        averageOverall: { type: ["number", "null"] }

    RatingInput:
      type: object
      required: [speed, comfort, privacy, ambiance, relief]
      properties:
        speed: { type: integer, minimum: 1, maximum: 5 }
        comfort: { type: integer, minimum: 1, maximum: 5 }
        privacy: { type: integer, minimum: 1, maximum: 5 }
        ambiance: { type: integer, minimum: 1, maximum: 5 }
        relief: { type: integer, minimum: 1, maximum: 5 }

    PoopLogInput:
      type: object
      required: [lat, lng, ratings]
      properties:
        groupId: { type: ["string", "null"] }
        lat: { type: number }
        lng: { type: number }
        locationName: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        ratings:
          $ref: "#/components/schemas/RatingInput"

    PoopLog:
      type: object
      required: [id, userId, userName, avatarColor, groupId, lat, lng, locationName, notes, ratings, overallScore, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        userName: { type: string }
        avatarColor: { type: string }
        groupId: { type: ["string", "null"] }
        lat: { type: number }
        lng: { type: number }
        locationName: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        ratings:
          $ref: "#/components/schemas/RatingInput"
        overallScore: { type: number }
        createdAt: { type: string, format: date-time }
